<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Draft Board</title>
<style>
:root{--ink:#0B1420;--ink2:#121E2E;--ink3:#182739;--line:#24374E;

--you:#4CC2FF;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--ink);color:var(--chalk);font-family:var(--sans);
font-size:15px;line-height:1.45;padding-bottom:82px}
h1,h2{margin:0;font-weight:800;letter-spacing:-.02em}
.top{position:sticky;top:0;z-index:20;background:rgba(11,20,32,.98);
backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{padding:8px 12px 4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.kick{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
h1{font-size:17px;text-transform:uppercase}
.tp{border:1px solid var(--line);background:var(--ink2);color:var(--dim);border-radius:6px;
padding:5px 8px;font-family:var(--mono);font-size:9px;cursor:pointer;letter-spacing:.06em;white-space:nowrap}
.tp.on{border-color:var(--odds);color:var(--odds);background:#241C0B}
.srch{padding:6px 12px 8px}
.srch input{width:100%;background:var(--ink2);border:1px solid var(--line);color:var(--chalk);
border-radius:9px;padding:10px 12px;font-size:15px;font-family:var(--sans)}
.srch input:focus{outline:none;border-color:var(--you)}
.slots,.rail{display:flex;gap:5px;overflow-x:auto;padding:0 12px 8px;scrollbar-width:none}
.slots::-webkit-scrollbar,.rail::-webkit-scrollbar,.rline::-webkit-scrollbar{display:none}
.slot{flex:0 0 auto;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);
background:var(--ink2);color:var(--dim);font-family:var(--mono);font-size:13px;font-weight:700;cursor:pointer}
.slot.on{background:var(--you);border-color:var(--you);color:#04121C}
.pk{flex:0 0 auto;padding:4px 9px;border-radius:7px;border:1px solid var(--line);
background:var(--ink2);cursor:pointer;text-align:center;min-width:50px}
.pk.on{border-color:var(--odds);background:#241C0B}
.pk.done{opacity:.4}
.pk .r{font-family:var(--mono);font-size:8px;color:var(--dim);letter-spacing:.08em}
.pk .n{font-family:var(--mono);font-size:14px;font-weight:700}
.pk.on .n{color:var(--odds)}
.fbar{display:flex;gap:5px;padding:7px 12px;overflow-x:auto;scrollbar-width:none;
border-top:1px solid var(--line)}
.fbar::-webkit-scrollbar{display:none}
.fc{flex:0 0 auto;padding:4px 11px;border-radius:20px;border:1px solid var(--line);
background:var(--ink2);color:var(--dim);font-family:var(--mono);font-size:10px;
letter-spacing:.08em;cursor:pointer}
.fc.on{background:var(--you);border-color:var(--you);color:#04121C;font-weight:700}
.tabs{display:flex;border-top:1px solid var(--line)}
.tab{flex:1;padding:9px;background:none;border:0;color:var(--dim);font-family:var(--mono);
font-size:10px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;border-bottom:2px solid transparent}
.tab.on{color:var(--chalk);border-bottom-color:var(--you)}
main{padding:12px}
.hd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px}
.hd h2{font-size:14px;text-transform:uppercase;letter-spacing:.04em}
.hd .sub{font-family:var(--mono);font-size:10px;color:var(--dim)}
.alert{padding:8px 11px;border-radius:8px;margin-bottom:7px;font-size:12.5px;display:flex;gap:8px}
.alert.red{background:#25101A;border:1px solid #5A1F2E;color:#FFB3C2}
.alert.amb{background:#241C0B;border:1px solid #5A4415;color:#F5D08A}
.alert b{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;display:block}
.verd{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:12px}
.v{background:var(--ink2);border:1px solid var(--line);border-radius:8px;padding:7px 4px;text-align:center}
.v .p{font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:.08em}
.v .w{font-family:var(--mono);font-size:12px;font-weight:700;margin-top:2px}
.v .g{font-family:var(--mono);font-size:8px;color:var(--dim)}
.grp{margin-bottom:16px}
.gl{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
color:var(--dim);margin-bottom:6px;display:flex;align-items:center;gap:7px}
.gl::after{content:"";flex:1;height:1px;background:var(--line)}
.gl.hot{color:var(--cliff)}
.row{display:flex;align-items:center;gap:8px;padding:7px 9px;margin-bottom:3px;
background:var(--ink2);border:1px solid var(--line);border-radius:8px}
.row.gone{opacity:.28}.row.gone .nm{text-decoration:line-through}
.row.mine{border-color:var(--you);background:#0D2130}

.pos{flex:0 0 27px;font-family:var(--mono);font-size:8px;font-weight:700;text-align:center;

.pos.DEF,.pos.PK{background:#232323;color:#B0B0B0}
.nm{flex:1;font-weight:600;font-size:13.5px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm .mt{font-family:var(--mono);font-size:9px;color:var(--dim);font-weight:400;margin-left:5px}
.odd{flex:0 0 40px;text-align:right;font-family:var(--mono);font-size:14px;font-weight:700}
.odd small{font-size:8px;font-weight:400;opacity:.6}
.add{flex:0 0 28px;height:28px;border-radius:6px;border:1px solid var(--line);
background:var(--ink3);color:var(--you);font-size:15px;font-weight:700;cursor:pointer;line-height:1}
.cb{margin:10px 0 7px;padding:5px 10px;border-radius:6px;
background:repeating-linear-gradient(135deg,#2A0F18 0 8px,#1C0A11 8px 16px);
border:1px solid #5A1F2E;font-family:var(--mono);font-size:9px;letter-spacing:.12em;
text-transform:uppercase;color:var(--cliff)}
.note{background:var(--ink2);border-left:3px solid var(--odds);border-radius:0 8px 8px 0;
padding:9px 11px;margin-bottom:12px;font-size:12.5px;color:var(--dim)}
.note b{color:var(--odds)}
.empty{color:var(--dim);font-size:12.5px;padding:18px 0;text-align:center}
.log{font-family:var(--mono);font-size:11.5px;padding:6px 9px;background:var(--ink2);
border:1px solid var(--line);border-radius:6px;margin-bottom:3px;display:flex;
justify-content:space-between;gap:8px}
.rost{position:fixed;bottom:0;left:0;right:0;background:var(--ink3);
border-top:1px solid var(--line);z-index:20}
.rline{display:flex;gap:7px;padding:7px 12px;overflow-x:auto;scrollbar-width:none;
font-family:var(--mono);font-size:9px;color:var(--dim);align-items:center}
.chip{flex:0 0 auto;padding:3px 7px;border-radius:5px;background:var(--ink2);border:1px solid var(--line)}
.chip.ok{color:var(--safe);border-color:#1E4A3C}
.chip.need{color:var(--cliff);border-color:#5A1F2E}
.btn{background:none;border:1px solid var(--line);color:var(--dim);border-radius:6px;
padding:4px 8px;font-family:var(--mono);font-size:9px;cursor:pointer;flex:0 0 auto}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* auto-tier: new tier when the ADP gap within a position exceeds threshold */
function tiers(pos){
  const g=P.filter(x=>x.p===pos&&!x.u).sort((a,b)=>adp(a)-adp(b));
  const out=[];let cur=[];
  g.forEach((x,i)=>{cur.push(x);const nx=g[i+1];
    if(!nx){out.push(cur);return}
    if(adp(nx)-adp(x)>Math.max(3,adp(x)*.055)){out.push(cur);cur=[]}});
  return out;
}


/* which draft slot owns overall pick n (12-team snake) */
function slotOf(n){const r=Math.ceil(n/12),i=((n-1)%12)+1;return r%2?i:13-i}

/* rebuild every team's roster from the picks feed */
function buildTeams(picks){
  const t={};for(let i=1;i<=12;i++)t[i]={QB:0,RB:0,WR:0,TE:0};
  picks.forEach(pk=>{const pos=(pk.metadata||{}).position;
    if(t[pk.draft_slot]&&t[pk.draft_slot][pos]!==undefined)t[pk.draft_slot][pos]++});
  return t;
}
/* how many teams picking before my next turn still need each position */
function demand(fromPick,toPick){
  const need={QB:0,RB:0,WR:0,TE:0},REQ={QB:1,RB:2,WR:3,TE:1};
  if(!LIVE.loaded)return null;
  const seen=new Set();
  for(let n=fromPick;n<toPick;n++){
    const sl=slotOf(n);if(sl===S.slot||seen.has(sl))continue;seen.add(sl);
    const r=LIVE.teams[sl]||{QB:0,RB:0,WR:0,TE:0};
    Object.keys(REQ).forEach(k=>{if(r[k]<REQ[k])need[k]++});
  }
  return{need,teams:seen.size};
}

function verdict(pos,pk,next){
  const pool=P.filter(x=>x.p===pos&&!isGone(x.n)&&!x.u).sort((a,b)=>adp(a)-adp(b));
  const now=pool.find(x=>avail(pk,x)>.30);
  if(!now)return{w:"—",g:"",c:"var(--dim)"};
  if(next===null)return{w:"LAST",g:"",c:"var(--odds)"};
  const eba=pool.find(x=>avail(next,x)>=.5);
  if(!eba)return{w:"TAKE",g:"cliff",c:"var(--cliff)"};
  const gap=Math.round(adp(eba)-adp(now));
  if(gap<=6)return{w:"WAIT",g:`−${gap}`,c:"var(--safe)"};
  if(gap<=15)return{w:"OK",g:`−${gap}`,c:"var(--odds)"};
  return{w:"TAKE",g:`−${gap}`,c:"var(--cliff)"};
}

function runAlert(){
  const last=S.gone.slice(-8).map(n=>byName[n]).filter(Boolean);
  if(last.length<6)return"";
  const c={};last.forEach(x=>c[x.p]=(c[x.p]||0)+1);
  const h=Object.entries(c).find(([k,v])=>v>=4&&["RB","WR","TE","QB"].includes(k));
  if(!h)return"";
  return`<div class="alert red"><span>🏃</span><div><b>${h[0]} run</b>
   ${h[1]} of the last ${last.length} picks. That tier empties before it's back to you.</div></div>`;
}

function roster(){
  const R=S.mine.map(n=>byName[n]).filter(Boolean);
  const c=p=>R.filter(x=>x.p===p).length;
  const qb=c("QB"),rb=c("RB"),wr=c("WR"),te=c("TE");
  const flex=Math.max(0,rb-2)+Math.max(0,wr-3)+Math.max(0,te-1);
  const need=[];
  if(qb<1)need.push("QB");if(rb<2)need.push(`RB×${2-rb}`);
  if(wr<3)need.push(`WR×${3-wr}`);if(te<1)need.push("TE");
  if(flex<2)need.push(`FLEX×${2-flex}`);
  const al=[];
  const risky=R.filter(x=>FLAG[x.n]);
  if(risky.length>=3)al.push(["red","🩹","Injury exposure",
    `${risky.length} flagged: ${risky.map(x=>x.n.split(" ").slice(-1)[0]).join(", ")}. This is how last year happened.`]);
  const by={};R.forEach(x=>{if(x.p!=="QB"&&x.p!=="PK"&&x.p!=="DEF")by[x.b]=(by[x.b]||0)+1});
  const bad=Object.entries(by).find(([,v])=>v>=4);
  if(bad)al.push(["amb","📅","Bye collision",
    `${bad[1]} skill players on Week ${bad[0]}. You start 3WR+TE+2FLEX — that's a loss.`]);
  const tm={};R.forEach(x=>tm[x.t]=(tm[x.t]||0)+1);
  const st=Object.entries(tm).find(([,v])=>v>=3);
  if(st)al.push(["amb","🔗","One offense",`${st[1]} from ${st[0]}. One bad season sinks three slots.`]);
  if(S.pickIdx+1>=6&&wr<3)al.push(["red","⚠️","Pass-catcher shortfall",
    `Round ${S.pickIdx+1} with ${wr} WR and you must start 3. Fix it now.`]);
  return{qb,rb,wr,te,flex,need,al};
}

function rowHTML(x,pk){
  const cls=S.mine.includes(x.n)?"mine":S.gone.includes(x.n)?"gone":"";
  const f=FLAG[x.n];
  let odd;
  if(pk!==null){const a=avail(pk,x);
    odd=`<div class="odd" style="color:${oc(a)}">${Math.round(a*100)}<small>%</small></div>`}
  else odd=x.u?`<div class="odd" style="color:var(--dim);font-size:9px">${x.dc?"DC"+x.dc:"—"}</div>`
    :`<div class="odd" style="color:var(--dim);font-size:11px">${adp(x).toFixed(0)}</div>`;
  const inj=x.inj?` <span style="color:var(--cliff);font-size:9px">${x.inj}</span>`:"";
  return`<div class="row ${cls}" data-n="${x.n.replace(/"/g,'&quot;')}">
   <div class="tz" data-act="gone"><div class="pos ${x.p}">${x.p}</div>
   <div class="nm">${x.n}<span class="mt">${x.t}·B${x.b}</span>${f?` <span title="${f}">🚩</span>`:""}${inj}</div>
   ${odd}</div><button class="add" data-act="mine">+</button></div>`;
}

function render(){
  const picks=myPicks(),pk=picks[S.pickIdx],next=picks[S.pickIdx+1]??null;
  document.getElementById("fmt").textContent=
    `12-TEAM · 3WR+2FLEX${S.tePrem?" · TE PREM":""} · SLOT ${S.slot}`;
  document.getElementById("tetog").classList.toggle("on",S.tePrem);
  document.getElementById("slots").innerHTML=Array.from({length:12},(_,i)=>
    `<button class="slot${i+1===S.slot?" on":""}" data-s="${i+1}">${i+1}</button>`).join("");
  document.getElementById("rail").innerHTML=picks.map((n,i)=>
    `<div class="pk${i===S.pickIdx?" on":""}${i<S.mine.length?" done":""}" data-i="${i}">
      <div class="r">R${i+1}</div><div class="n">${n}</div></div>`).join("");
  document.getElementById("fbar").innerHTML=FILTS.map(([k,l])=>
    `<button class="fc${filt===k?" on":""}" data-f="${k}">${l}</button>`).join("");
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.v===view));
  const R=roster(),m=document.getElementById("main");

  if(query){
    const q=query.toLowerCase();
    const hits=P.filter(x=>inFilt(x)&&x.n.toLowerCase().includes(q)).slice(0,25);
    m.innerHTML=`<div class="hd"><h2>Search</h2><div class="sub">${hits.length} found</div></div>
      <div class="note">Tap a name to cross off · <b>+</b> to add to your team</div>
      ${hits.length?hits.map(x=>rowHTML(x,pk)).join(""):`<div class="empty">No match.</div>`}`;
  } else if(view==="plan"){
    const live=P.filter(x=>!isGone(x.n)&&inFilt(x)&&!x.u).map(x=>({x,a:avail(pk,x)}));
    const now=live.filter(o=>o.a>=.12&&o.a<=.70).sort((a,b)=>adp(a.x)-adp(b.x)).slice(0,12);
    const wait=live.filter(o=>o.a>.70&&o.a<.985).sort((a,b)=>adp(a.x)-adp(b.x)).slice(0,16);
    m.innerHTML=`<div class="hd"><h2>Round ${S.pickIdx+1} · Pick ${pk}</h2>
      <div class="sub">${LIVE.loaded?`on clock: ${LIVE.n} · ${Math.max(0,pk-LIVE.n)} away`:`next: ${next??"—"}`}</div></div>
      ${runAlert()}${R.al.map(a=>`<div class="alert ${a[0]}"><span>${a[1]}</span>
        <div><b>${a[2]}</b>${a[3]}</div></div>`).join("")}
      <div class="verd">${["RB","WR","TE","QB"].map(p=>{const v=verdict(p,pk,next);
        return`<div class="v"><div class="p">${p}</div>
        <div class="w" style="color:${v.c}">${v.w}</div><div class="g">${v.g}</div></div>`}).join("")}</div>
      ${(()=>{const d=demand(LIVE.n,pk);if(!d||!d.teams)return"";
        const cell=(k,l)=>{const v=d.need[k],hot=v/d.teams>=.5;
          return `<div class="v"><div class="p">${l}</div>
          <div class="w" style="color:${hot?"var(--cliff)":"var(--dim)"}">${v}</div>
          <div class="g">of ${d.teams}</div></div>`};
        return `<div class="gl">Teams needing each position before pick ${pk}</div>
        <div class="verd">${cell("RB","RB")}${cell("WR","WR")}${cell("TE","TE")}${cell("QB","QB")}</div>`})()}
      <div class="note"><b>WAIT</b> = you'll get someone as good at ${next??"—"}.
        <b>TAKE</b> = cliff. Numbers on the right are odds he's still there at ${pk}.</div>
      ${now.length?`<div class="grp"><div class="gl hot">Won't last — decide now</div>
        ${now.map(o=>rowHTML(o.x,pk)).join("")}</div>`:""}
      ${wait.length?`<div class="grp"><div class="gl">Likely still here</div>
        ${wait.map(o=>rowHTML(o.x,pk)).join("")}</div>`:
        `<div class="empty">No ${filt==="ALL"?"players":filt+"s"} modelled at this pick${filt!=="ALL"?" — tap ALL or check the Board":" — use Board or search"}.</div>`}`;
  } else if(view==="board"){
    let h=`<div class="hd"><h2>Full board</h2><div class="sub">tap = gone · + = mine</div></div>`;
    ["RB","WR","TE","QB","DEF","PK"].filter(z=>filt==="ALL"||z===filt).forEach(pos=>{
      const ts=tiers(pos);if(!ts.length)return;
      h+=`<div class="gl">${pos}</div>`;
      ts.forEach((t,i)=>{
        h+=`<div class="grp">${t.map(x=>rowHTML(x,null)).join("")}</div>`;
        if(i<ts.length-1&&i<6)h+=`<div class="cb">▼ tier break</div>`;
      });
      const un=P.filter(x=>x.p===pos&&x.u).sort((a,b)=>(a.dc||99)-(b.dc||99));
      if(un.length)h+=`<div class="gl">${pos} · unranked depth (${un.length})</div>
        <div class="grp">${un.slice(0,40).map(x=>rowHTML(x,null)).join("")}</div>`;
    });
    m.innerHTML=h;
  } else {
    m.innerHTML=`<div class="hd"><h2>My team</h2><div class="sub">${S.mine.length} drafted</div></div>
      ${R.al.map(a=>`<div class="alert ${a[0]}"><span>${a[1]}</span>
        <div><b>${a[2]}</b>${a[3]}</div></div>`).join("")}
      ${S.mine.length?`<div class="grp"><div class="gl">Draft log · reach vs ADP</div>
      ${S.mine.map((n,i)=>{const x=byName[n];if(!x)return"";const at=picks[i]??"?";
        const d=Math.round(adp(x)-at),c=d<-8?"var(--cliff)":d<0?"var(--odds)":"var(--safe)";
        return`<div class="log"><span>R${i+1} · ${x.p} ${n}</span>
        <span style="color:${c};font-weight:700">${d>0?"+"+d:d}</span></div>`}).join("")}</div>
      <div class="note">Negative = you reached. Past <b>−8</b> is red. Screenshot this after the draft.</div>`
      :`<div class="empty">Nothing yet. Hit <b>+</b> on a player.</div>`}
      <div class="grp"><div class="gl">Sleeper sync</div><div class="note" id="syncmsg">Off. Tap SYNC up top to auto-track every pick.</div><input id="uname" value="${S.user}" placeholder="Sleeper username" style="width:100%;background:var(--ink2);border:1px solid var(--line);color:var(--chalk);border-radius:8px;padding:9px 11px;font-family:var(--mono);font-size:13px;margin-bottom:6px"><button class="btn" id="detect" style="padding:8px 12px">Detect my slot</button><div class="note" id="detmsg">Finds your draft slot and draft ID automatically.</div></div><div class="grp"><div class="gl">Full player pool</div><button class="btn" id="loadpool" style="padding:8px 12px">${poolLoaded?"Reload pool":"Load full player list"}</button><div class="note" id="poolmsg">${poolLoaded?`${P.length} players loaded.`:"Adds every rostered NFL player so late rounds never run dry, and makes pick matching exact by player ID. ~5MB, once. Do this before the draft starts."}</div></div><div class="grp"><button class="btn" id="wipe" style="padding:8px 12px">Reset everything</button></div>`;
  }

  document.getElementById("rline").innerHTML=
    [["QB",R.qb,1],["RB",R.rb,2],["WR",R.wr,3],["TE",R.te,1],["FLEX",R.flex,2]]
    .map(([l,v,n])=>`<span class="chip ${v>=n?"ok":"need"}">${l} ${v}/${n}</span>`).join("")
    +(R.need.length?`<span class="chip need">Need ${R.need.join(" ")}</span>`
      :`<span class="chip ok">Starters full</span>`)
    +`<span class="chip">${S.gone.length+S.mine.length} off · ${P.length} pool</span>`;
  save();
}

document.getElementById("q").addEventListener("input",e=>{query=e.target.value.trim();render()});


/* ---------- Sleeper live sync ---------- */
let syncTimer=null;
function smsg(t){const e=document.getElementById("syncmsg");if(e)e.innerHTML=t;
  const b=document.getElementById("syncbtn");if(b)b.classList.toggle("on",!!syncTimer)}
function matchPlayer(md,pid){
  if(pid&&byId[pid])return byId[pid];
  const full=`${md.first_name||""} ${md.last_name||""}`.trim();
  return P.find(x=>x.n===full)
      || P.find(x=>x.n.replace(/ (Jr\.|Sr\.|II|III)$/,"")===full)
      || P.find(x=>x.n.split(" ").slice(-1)[0]===md.last_name&&x.p===md.position);
}
async function pollSync(){
  try{
    const r=await fetch(`https://api.sleeper.app/v1/draft/${S.draftId}/picks`);
    if(!r.ok)throw new Error("HTTP "+r.status);
    const picks=(await r.json()).sort((a,b)=>a.pick_no-b.pick_no);
    LIVE.n=picks.length+1;LIVE.teams=buildTeams(picks);LIVE.loaded=true;
    let added=0,unmatched=0;
    picks.forEach(pk=>{
      const m=matchPlayer(pk.metadata||{},pk.player_id);
      if(!m){unmatched++;return}
      const mine=pk.draft_slot===S.slot;
      if(mine){if(!S.mine.includes(m.n)){S.gone=S.gone.filter(v=>v!==m.n);
        S.mine.push(m.n);S.hist.push(m.n);added++}}
      else if(!isGone(m.n)){S.gone.push(m.n);S.hist.push(m.n);added++}
    });
    if(S.mine.length)S.pickIdx=Math.min(15,S.mine.length);
    smsg(`<span style="color:var(--safe)">LIVE</span> · pick ${LIVE.n} · slot ${slotOf(LIVE.n)} on the clock`
      +(added?` · +${added} new`:"")+(unmatched?` · ${unmatched} unmatched`:""));
    render();
  }catch(e){
    const cors=/Failed to fetch|NetworkError|Load failed/i.test(e.message);
    smsg(`<span style="color:var(--cliff)">${e.message}</span><br>`
      +(cors?"Browser blocked the request. Manual tapping still works — that's the fallback."
            :"Check the draft ID.")); 
    clearInterval(syncTimer);syncTimer=null;
  }
}


/* Pull Sleeper's full player list (~5MB, once per session).
   Ranked players keep their ADP and gain a player_id; everyone else
   joins as unranked depth for the late rounds. */
async function loadPool(){
  const st=t=>{const e=document.getElementById("poolmsg");if(e)e.innerHTML=t};
  if(poolLoaded){st("Already loaded.");return}
  const btn=document.getElementById("loadpool");if(btn)btn.textContent="Loading…";
  try{
    st("Downloading ~5MB…");
    const all=await fetch("https://api.sleeper.app/v1/players/nfl").then(r=>r.json());
    const KEEP=new Set(["QB","RB","WR","TE","K","DEF"]);
    let added=0,linked=0;
    for(const id in all){
      const a=all[id];if(!a||!KEEP.has(a.position))continue;
      if(a.position!=="DEF"&&!a.team)continue;              /* free agents out */
      if(a.position!=="DEF"&&a.status&&a.status!=="Active")continue;
      const nm=a.position==="DEF"?`${a.team} Defense`
        :`${a.first_name||""} ${a.last_name||""}`.trim();
      const pos=a.position==="K"?"PK":a.position;
      let ex=byName[nm]||P.find(x=>x.p===pos&&x.t===a.team&&
        x.n.split(" ").slice(-1)[0]===a.last_name);
      if(ex){ex.id=id;byId[id]=ex;linked++;continue}
      const np={n:nm,p:pos,t:a.team||"FA",b:TEAMBYE[a.team]||0,a:null,s:null,id,
        u:true,dc:a.depth_chart_order||null,inj:a.injury_status||null};
      P.push(np);byName[nm]=np;byId[id]=np;added++;
    }
    poolLoaded=true;
    st(`<span style="color:var(--safe)">Loaded</span> · ${linked} linked to ADP · `
      +`${added} unranked added · ${P.length} total`);
    if(btn)btn.textContent="Reload pool";
    render();
  }catch(e){
    st(`<span style="color:var(--cliff)">${e.message}</span> — board still works without it.`);
    if(btn)btn.textContent="Load full player list";
  }
}

async function detectSlot(){
  const st=t=>{const e=document.getElementById("detmsg");if(e)e.innerHTML=t};
  const un=(document.getElementById("uname")?.value||S.user).trim();
  if(!un){st("Enter your Sleeper username.");return}
  try{
    st("Looking up…");
    const u=await fetch(`https://api.sleeper.app/v1/user/${encodeURIComponent(un)}`).then(r=>r.json());
    if(!u||!u.user_id)throw new Error("username not found");
    const ds=await fetch(`https://api.sleeper.app/v1/league/${S.leagueId}/drafts`).then(r=>r.json());
    const d=ds.find(x=>x.status!=="complete")||ds[0];
    if(!d)throw new Error("no draft on this league");
    S.draftId=d.draft_id;S.user=un;
    const sl=d.draft_order&&d.draft_order[u.user_id];
    if(!sl)throw new Error("draft order not posted yet — set slot by hand");
    S.slot=sl;render();
    st(`<span style="color:var(--safe)">Slot ${sl}</span> · draft ${d.draft_id} · ${d.settings.rounds} rounds`);
  }catch(e){st(`<span style="color:var(--cliff)">${e.message}</span>`)}
}

function toggleSync(){
  if(syncTimer){clearInterval(syncTimer);syncTimer=null;smsg("Sync off.");return}
  smsg("Connecting…");pollSync();syncTimer=setInterval(pollSync,10000);
}

document.addEventListener("click",e=>{
  const s=e.target.closest(".slot"),p=e.target.closest(".pk"),
        t=e.target.closest(".tab"),r=e.target.closest(".row");
  const f=e.target.closest(".fc");
  if(f){filt=f.dataset.f;render()}
  else if(s){S.slot=+s.dataset.s;render()}
  else if(p){S.pickIdx=+p.dataset.i;render()}
  else if(t){view=t.dataset.v;query="";document.getElementById("q").value="";render()}
  else if(e.target.id==="tetog"){S.tePrem=!S.tePrem;render()}
  else if(e.target.id==="loadpool"){loadPool()}
  else if(e.target.id==="detect"){detectSlot()}
  else if(e.target.id==="syncbtn"){view="team";query="";document.getElementById("q").value="";render();toggleSync()}
  else if(e.target.id==="undo"){const last=S.hist.pop();
    if(last){S.gone=S.gone.filter(n=>n!==last);S.mine=S.mine.filter(n=>n!==last)}render()}
  else if(e.target.id==="wipe"){
    if(confirm("Clear all picks and start over?")){S={slot:S.slot,pickIdx:0,tePrem:S.tePrem,
      gone:[],mine:[],hist:[]};render()}}
  else if(r){
    const n=r.dataset.n.replace(/&quot;/g,'"'),act=e.target.closest("[data-act]")?.dataset.act;
    if(act==="mine"){
      if(S.mine.includes(n)){S.mine=S.mine.filter(v=>v!==n)}
      else{S.mine.push(n);S.gone=S.gone.filter(v=>v!==n);S.hist.push(n)}
    }else{
      if(S.mine.includes(n))S.mine=S.mine.filter(v=>v!==n);
      else if(S.gone.includes(n))S.gone=S.gone.filter(v=>v!==n);
      else{S.gone.push(n);S.hist.push(n)}
    }
    if(query){query="";document.getElementById("q").value=""}
    render();
  }
});
render();
</script>
